name: PyTest for Distributed Learning

on: [pull_request, push]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      # Each Python version runs in its own VM, so they can run in parallel
      # But we'll run test files sequentially within each VM

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android || true

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          poetry lock --no-interaction
          poetry install --no-interaction --no-ansi

      - name: Install CPU-only PyTorch & tensorlink
        run: |
          pip cache purge || true
          pip install --no-cache-dir torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir .

      - name: Run Tests Sequentially
        run: |
          set +e

          failed=0

          poetry run pytest tests/test_node.py --print-level=30
          status=$?
          if [ $status -ne 0 ]; then
            echo "❌ test_node.py failed with exit code $status"
            failed=1
          fi

          poetry run pytest tests/test_distributed_model.py --print-level=30
          status=$?
          if [ $status -ne 0 ]; then
            echo "❌ test_distributed_model.py failed with exit code $status"
            failed=1
          fi

          poetry run pytest tests/test_model_api.py --print-level=30
          status=$?
          if [ $status -ne 0 ]; then
            echo "❌ test_model_api.py failed with exit code $status"
            failed=1
          fi

          if [ $failed -ne 0 ]; then
            echo "❌ One or more test suites failed."
            exit 1
          fi

          echo "✅ All test suites passed."

      - name: Dump debug log on failure
        if: failure()
        run: |
          echo "===== TENSORLINK DEBUG LOG ====="
          cat logs/runtime.log